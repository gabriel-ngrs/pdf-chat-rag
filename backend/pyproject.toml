[project]
name = "talkdoc-backend"
version = "0.1.0"
description = "API do TalkDoc — ingestão de PDFs e chat com RAG"
requires-python = ">=3.12"
dependencies = [
    # >=0.135 traz SSE nativo (fastapi.sse.EventSourceResponse), que já cuida
    # de Content-Type, Cache-Control, X-Accel-Buffering e keep-alive.
    "fastapi>=0.135",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "asyncpg>=0.30",
    "pypdf>=5.1",
    "google-genai>=0.3",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "import-linter>=2.13",
    "bandit>=1.9.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

# asyncpg não publica py.typed. Ignorar a ausência de stubs é o mínimo para
# manter o strict valendo no resto do pacote — nada além disso é afrouxado.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# `-m 'not db'` é o que faz `make test` rodar na máquina de quem clona o projeto,
# sem Postgres no ar; os testes de banco são alcançados por `make test-db`.
# O piso de cobertura mede só `app.core`, que é o alcance da NFR-10. O alvo é
# escrito como nome de módulo, e não como caminho: as duas formas coletam a
# mesma coisa quando o pytest roda a partir de `backend/`, mas a de caminho
# depende do diretório de trabalho e falha calada — com 0% e um
# `CoverageWarning: module never imported` — quando ele muda.
addopts = "-m 'not db' --cov=app.core --cov-report=term-missing --cov-fail-under=90"

markers = [
    "db: exige o Postgres do docker compose no ar; fora da suíte offline.",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
