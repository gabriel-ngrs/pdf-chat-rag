services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talkdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talkdoc}
      POSTGRES_DB: ${POSTGRES_DB:-talkdoc}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      # Publicado para os testes de integração e o make eval alcançarem o banco
      # a partir do host. Não é necessário para a aplicação em si.
      - "5432:5432"
    healthcheck:
      # -h 127.0.0.1 é obrigatório: sem ele o pg_isready fala com o servidor
      # temporário do entrypoint pelo socket unix e responde OK enquanto o
      # init.sql ainda roda e a porta TCP está fechada — liberando o backend
      # cedo demais.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-talkdoc} -d ${POSTGRES_DB:-talkdoc}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talkdoc}:${POSTGRES_PASSWORD:-talkdoc}@db:5432/${POSTGRES_DB:-talkdoc}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?defina GEMINI_API_KEY no .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
