<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalkDoc — converse com o seu PDF</title>
    <meta
      name="description"
      content="Envie um PDF e converse com ele. As respostas citam a página de origem."
    />
    <!-- O símbolo do produto, o mesmo de `BrandMark.tsx`. SVG e não .ico: um
         só arquivo de 400 B serve todos os tamanhos, e a cor é a da marca nos
         dois esquemas do navegador. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Aplica o tema antes da primeira pintura: sem isto a página pisca no
         tema errado enquanto o React monta.

         O padrão é o escuro desde a MELH-002, e não mais o do sistema. Precisa
         combinar com o `defaultTheme` do `ThemeProvider` em `App.tsx`: se os
         dois discordarem, a página pinta um tema e o React troca para o outro
         no primeiro frame — que é exatamente o piscar que este script existe
         para evitar. Quem escolheu explicitamente continua mandando: o valor
         guardado é lido antes de qualquer padrão. -->
    <script>
      (function () {
        var saved = localStorage.getItem('talkdoc:theme')
        var theme = saved === 'light' || saved === 'dark' ? saved : 'dark'
        document.documentElement.classList.toggle('dark', theme === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
