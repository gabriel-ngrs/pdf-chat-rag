<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalkDoc — converse com o seu PDF</title>
    <meta
      name="description"
      content="Envie um PDF e converse com ele. As respostas citam a página de origem."
    />
    <!-- Aplica o tema antes da primeira pintura: sem isto a página pisca no
         tema errado enquanto o React monta. -->
    <script>
      (function () {
        var saved = localStorage.getItem('talkdoc:theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
