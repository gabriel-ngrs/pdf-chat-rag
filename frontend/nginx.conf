server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html NUNCA é cacheado, e os assets são cacheados para sempre.
    #
    # Os dois lados da mesma regra, e ela não é otimização — é correção. Sem
    # `Cache-Control` no index.html o navegador aplica cache heurístico (uma
    # fração do tempo desde o `Last-Modified`) e continua pedindo os assets do
    # build anterior. O efeito é uma imagem nova no ar e a tela velha na frente
    # de quem abriu a página antes: foi exatamente o que aconteceu depois do
    # primeiro rebuild, e aconteceria com o avaliador do desafio também.
    #
    # O index.html é o único arquivo cujo nome não muda entre builds, então ele
    # é o único que precisa ser revalidado. Os assets levam hash de conteúdo no
    # nome — build novo, nome novo —, e por isso podem ser imutáveis: ninguém
    # pede duas vezes o mesmo nome esperando conteúdo diferente.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # API: proxy para o backend.
    #
    # Sem barra final no proxy_pass — com ela o nginx substituiria o prefixo
    # casado e /api/documents chegaria ao backend como /documents, divergindo
    # do proxy do Vite (que preserva o prefixo) e quebrando o app no Docker.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';

        # Upload: o default do nginx é 1m, abaixo do MAX_UPLOAD_MB do backend.
        # Sem isto o nginx recusa com HTML antes de a requisição tocar a API.
        client_max_body_size 30m;

        # Streaming SSE: sem buffering e sem timeout curto.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
